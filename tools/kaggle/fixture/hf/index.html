<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=640, height=360">
<style>
  /* a minimal HyperFrames composition (engines/README.md's "minimal writing style"): a paused GSAP
     timeline registered on window.__timelines, every clip declaring its own data-start — the two
     scene cuts render-split's plan would read. Clear of the engine's four fast-capture compile
     gates on purpose (no CSS 3D, no mix-blend-mode, no background-image on the composition's
     ancestors, no shader transitions), so a hardware-GPU render.sh asks for the fast capture. */
  html, body { margin: 0; width: 640px; height: 360px; background: #10141f; overflow: hidden; }
  #root { position: relative; width: 640px; height: 360px; }
  .card { position: absolute; left: 60px; top: 120px; padding: 18px 26px; border-radius: 12px;
          background: #f5efe6; color: #10141f; font: 700 34px/1.2 sans-serif; }
  .dot { position: absolute; left: 300px; top: 168px; width: 24px; height: 24px; border-radius: 50%;
         background: #ffc241; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="640" data-height="360">
  <div class="card" data-start="0" data-duration="4">The quick draft</div>
  <div class="card" data-start="4" data-duration="4" style="top: 200px;">The final pass</div>
  <div class="dot" data-start="0" data-duration="8"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });    // paused: the renderer advances the time
  tl.fromTo(".dot", { x: 0 }, { x: 260, duration: 8, ease: "none" }, 0);
  tl.fromTo(".card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5 }, 0);
  tl.to(".card", { opacity: 0, y: -24, duration: 0.4 }, 3.6);
  tl.fromTo("#root .card:nth-of-type(2)", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4);
  window.__timelines["main"] = tl;               // the key the renderer looks for
</script>
</body>
</html>
