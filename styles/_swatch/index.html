<!doctype html>
<html lang="en" data-composition-variables='[{"id":"style","type":"string","label":"Style slug: demo | catalog | catalog-fx | fontprobe | a folder under styles/ (staged by render.sh)","default":"demo"},{"id":"hud","type":"boolean","label":"Draw a t / frame readout (draft checks only)","default":false}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Style swatch shell: one full-frame canvas, every frame = scene.renderAt(t). See README.md. -->
    <link id="fontcss" rel="stylesheet" href="fonts.css" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
      #fx { position: absolute; left: 0; top: 0; width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="5" data-fps="30" data-width="1920" data-height="1080">
      <canvas id="c" width="1920" height="1080"></canvas>
    </div>
    <!-- SVG filters that canvas can reference with ctx.filter = "url(#…)" (lib.inkBleed / lib.roughen set their attributes per call) -->
    <svg id="fx" aria-hidden="true">
      <filter id="ovh-ink" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence id="ovh-ink-turb" type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="1" result="n" />
        <feGaussianBlur id="ovh-ink-blur" in="SourceGraphic" stdDeviation="4" result="b" />
        <feDisplacementMap id="ovh-ink-disp" in="b" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feComponentTransfer in="d"><feFuncA id="ovh-ink-alpha" type="linear" slope="4" intercept="-1.2" /></feComponentTransfer>
      </filter>
      <filter id="ovh-rough" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence id="ovh-rough-turb" type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap id="ovh-rough-disp" in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- lib.duotone sets the three tableValues per call: luminance in, dark→light ramp out -->
      <filter id="ovh-duotone" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0" result="g" />
        <feComponentTransfer in="g">
          <feFuncR id="ovh-duo-r" type="table" tableValues="0.063 1" />
          <feFuncG id="ovh-duo-g" type="table" tableValues="0.114 1" />
          <feFuncB id="ovh-duo-b" type="table" tableValues="0.259 1" />
        </feComponentTransfer>
      </filter>
    </svg>
    <script>
      // Classic script, runs before anything async: HyperFrames polls window.__hf.buildReady right away, and a hold
      // registered later (inside a module) leaves blank frames at the start of every parallel worker.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["style-swatch"] = new Promise(function (resolve) { window.__swatchResolve = resolve; });
      // Remember the latest seek even before the scene is loaded; boot.js draws it once ready.
      window.__swatchT = 0;
      window.addEventListener("hf-seek", function (e) {
        window.__swatchT = Number(e.detail && e.detail.time) || 0;
        if (window.__swatchDraw) window.__swatchDraw(window.__swatchT);
      });
    </script>
    <script type="module" src="boot.js"></script>
  </body>
</html>
