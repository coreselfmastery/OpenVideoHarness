# The repo's own checks (tools/ci.sh) on Linux and on macOS.
# Both job names are required status checks in the main-branch ruleset (.github/rulesets/main.json):
# renaming a job or an OS here means updating that ruleset too.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # the kaggle group's end-to-end suite renders for real: a 32 s split film (a minute on Linux,
    # 6–8 min on the macOS runners, whose ARM Chrome draws slower), the css-cost twin films and the
    # bake, and render.sh through the real engine — whose first run also downloads the engine and
    # its chrome-headless-shell. The budgets inside tools/kaggle/test.sh bound a wedged host; this
    # ceiling only has to sit above a healthy (even slow) one, and 25 min no longer did
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # uv runs the Python behind bin/vh (music, storyboard, rhythm, cover-preview …); without it those smoke tests skip.
      # Its cache (pillow, numpy, scipy …) is kept between runs, keyed on this file: bump the pins here to refresh it.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install check tools
        run: |
          python3 -m pip install --quiet pyflakes
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck ffmpeg >/dev/null
          else   # ffmpeg lets the bin/vh mux/gif smoke tests run under macOS /bin/bash 3.2 too
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet ffmpeg >/dev/null
          fi
      # Linux: GNU userland. macOS: BSD userland, and bin/vh runs under the system /bin/bash 3.2 that Mac users have.
      - name: tools/ci.sh
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export VH_BASH=/bin/bash; fi
          tools/ci.sh
